---
- name: Install Docker packages
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true

- name: Enable Docker service
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started

- name: Add ops user to docker group
  ansible.builtin.user:
    name: "{{ ops_user }}"
    groups: docker
    append: true