---
- name: Create robotics project root
  ansible.builtin.file:
    path: "{{ jetson_project_root }}"
    state: directory
    owner: "{{ ops_user }}"
    group: "{{ ops_user }}"
    mode: "0755"

- name: Capture Jetson release information
  ansible.builtin.command: cat /etc/nv_tegra_release
  register: tegra_release
  failed_when: false
  changed_when: false

- name: Show Jetson release information
  ansible.builtin.debug:
    var: tegra_release.stdout