---
- name: Verify edge node readiness
  hosts: edge
  gather_facts: true
  tasks:
    - name: Check Docker
      ansible.builtin.command: docker --version
      register: docker_version
      changed_when: false

    - name: Check ROS environment
      ansible.builtin.shell: |
        if [ -f /opt/ros/{{ ros_distro | default('humble') }}/setup.bash ]; then
          . /opt/ros/{{ ros_distro | default('humble') }}/setup.bash
          ros2 --help >/dev/null
        fi
      args:
        executable: /bin/bash
      changed_when: false

    - name: Print Docker version
      ansible.builtin.debug:
        var: docker_version.stdout