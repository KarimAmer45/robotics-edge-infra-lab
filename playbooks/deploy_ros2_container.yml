---
- name: Deploy a ROS 2 container workload to Jetson nodes
  hosts: jetson
  become: true
  vars:
    container_name: ros2-perception
    image_name: "{{ deployment_images.perception }}"
    ros_domain_id: 42
  tasks:
    - name: Ensure project root exists
      ansible.builtin.file:
        path: "{{ jetson_project_root }}"
        state: directory
        owner: "{{ ops_user }}"
        group: "{{ ops_user }}"
        mode: "0755"

    - name: Stop previous workload if present
      ansible.builtin.command:
        cmd: docker rm -f {{ container_name }}
      register: stop_result
      failed_when: false
      changed_when: "'No such container' not in stop_result.stderr"

    - name: Start ROS 2 perception container
      ansible.builtin.command:
        cmd: >
          docker run -d --name {{ container_name }}
          --restart unless-stopped
          --net host --ipc host
          --runtime nvidia
          -e ROS_DOMAIN_ID={{ ros_domain_id }}
          {{ image_name }}
      changed_when: true